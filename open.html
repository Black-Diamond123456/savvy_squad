<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savvy Squad</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            background: blue;
            background: linear-gradient(180deg, #2d1b4e, #1a1035);
            color: #fff;
            padding: 30px 20px;
        }

        h1 {
            color: darkblue;
            font-family: 'Courier New', Courier, monospace;
            font-size: 100px;
            text-align: center;
        }

        h3 {
            color: #c9bce8;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 24px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        h4 {
            text-align: left;
            color: #e6def7;
            max-width: 400px;
            font-size: 14px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0 0 4px 0;
        }

        input {
            display: block;
            width: 100%;
            max-width: 380px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            padding: 10px 12px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin-bottom: 10px;
        }

        :placeholder-shown {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        button {
            background: #e24b4a;
            width: 100%;
            padding: 10px 12px;
            margin: 0 auto 18px auto;
            padding-left: 20;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            border: 2px solid #e24b4a;
            background-color: blueviolet;
            margin-top: 20;
        }

        .mediaUpload {
            display: block;
            background: #fff;
            border: 2px dashed #e24b4a;
            border-radius: 8px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<h1>Savvy Squad</h1>
<h3>Where fun never ENDS!!!</h3>

<body>
    <h4>Name</h4>
    <br>
    <input type="text" , id="addName" , placeholder="Enter name">
    <br>
    <h4>Age</h4>
    <input type="number" , id="ageNo" , placeholder="Enter age">
    <br>
    <h4>Hobby</h4>
    <input type="text" , id="hobbyType" , placeholder="Eg gaming, dancing.....">
    <br>
    <h4>Country</h4>
    <input type="text" , id="countryName" , placeholder="Enter your country">
    <br>
    <h4>A little about you(optional)</h4>
    <input type="text" , id="someThing" , placeholder="Something people should know">
    <br>
    <h4>Email</h4>
    <input type="email" id="addEmail" placeholder="Enter your email">
    <h4>Picture</h4>
    <label for="mediaUpload" class="mediaUpload" ;">Tap
        to upload picture</label>
    <input type="file" , id="mediaUpload" accept="image/*" style="display: none;">
    <button onclick="addDetails()">Submit</button>
    <li id="nameList"></li>
    <div id="successPopup"
        style="display: none; position: fixed; top: 20px; left: 50%; transform:translateX(-50%); background: #fff; border:2px solid #e24b4a; border-radius: 8px; padding: 12px 20px; color:#2d1b4e; font-weight: bold; z-index: 10;">
        Submission Successful
    </div>
    <script>
        function addDetails() {
            let name = document.getElementById("addName").value.trim();
            let age = document.getElementById("ageNo").value.trim();
            let hobby = document.getElementById("hobbyType").value.trim();
            let country = document.getElementById("countryName").value.trim();
            let something = document.getElementById("someThing").value.trim();
            let email = document.getElementById("addEmail").value.trim();
            let mediaFile = document.getElementById("mediaUpload").files[0]
            if (name === "" || age === "" || hobby === "" || country === "" || email === "") {
                alert("All fields are required");
                return
            };
            if (age !== "" && (Number(age) <= 0 || Number(age) > 50)) {
                alert("Enter a valid age");
                return;
            };
            if (hobby.length > 50) {
                alert("Hobby/bio is too long")
                return;
            }
            let formData = new FormData();
            formData.append("name", name);
            formData.append("age", age);
            formData.append("hobby", hobby);
            formData.append("country", country);
            formData.append("email", email);
            formData.append("something", something === "" ? "Not Provided" : something);
            if (mediaFile) {
                formData.append("media", mediaFile);
            }
            fetch("/submit", {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("addName").value = "";
                    document.getElementById("ageNo").value = "";
                    document.getElementById("hobbyType").value = "";
                    document.getElementById("countryName").value = "";
                    document.getElementById("someThing").value = "";
                    document.getElementById("addEmail").value = "";
                    document.getElementById("mediaUpload").value = "";
                    showSuccessPopup();
                })
                .catch(error => {
                    alert("Something went wrong, please try again");
                    console.log(error)
                });


        }
        function showSuccessPopup() {
            let popup = document.getElementById("successPopup");
            popup.style.display = "block";
            setTimeout(function () {
                popup.style.display = "none"
            }, 3000);
        }
    </script>
</body>

</html>
